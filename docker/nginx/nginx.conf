# ---------------------------------------------------------------------------
# Serves the built frontend and proxies /api to the API container.
#
# One origin for the browser means no CORS in production, and the API is never
# exposed directly to the internet.
#
# Note on headers: nginx inherits `add_header` from an outer level only when the
# current level declares none of its own. Every location below therefore
# `include`s security-headers.conf rather than relying on inheritance — without
# that, the locations which set their own Cache-Control would serve the HTML
# document with no CSP at all.
# ---------------------------------------------------------------------------

upstream jeebhar_api {
    # `server` is the service name in docker-compose.yml.
    server server:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Container health probe.
    location = /healthz {
        include /etc/nginx/security-headers.conf;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        include /etc/nginx/security-headers.conf;

        proxy_pass http://jeebhar_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Hashed build assets are immutable; cache them hard.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    # Brand artwork and icons change rarely.
    location ~* ^/(brand/|favicon|apple-touch-icon|icon-).*\.(png|ico|svg)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # index.html must never be cached, or a deploy will not reach the browser.
    # This is also the response where the CSP matters most, which is exactly why
    # the include above is repeated here.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Single-page app: unknown paths fall through to index.html.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
