# Security headers, kept in one file and `include`d by every location block.
#
# nginx inherits `add_header` from an outer level ONLY if the current level
# defines none of its own. Any location that sets a header of its own — for
# example a Cache-Control — therefore loses all the server-level ones, so each
# such location includes this file explicitly.
#
# The CSP allows the Google Fonts stylesheet and the remote images referenced by
# site content. Tighten `img-src` and drop the font hosts once those assets are
# self-hosted.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
