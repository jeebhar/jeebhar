# ---------------------------------------------------------------------------
# Full stack: MongoDB, the API and nginx serving the built frontend.
#
#   cp .env.docker.example .env
#   docker compose up -d --build
#   open http://localhost:8080
#
# nginx proxies /api to the API container, so the browser only ever talks to
# port 8080 and MongoDB is never published to the host network.
# ---------------------------------------------------------------------------

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-jeebhar}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-jeebhar}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [jeebhar]

  server:
    # SERVER_IMAGE lets a deploy point at a published image; locally it defaults
    # to a tag built from source by the `build:` block below.
    image: ${SERVER_IMAGE:-jeebhar-server:local}
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGODB_URI: mongodb://${MONGO_USER:-jeebhar}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-jeebhar}?authSource=admin
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_TO: ${MAIL_TO:-}
      MAIL_FROM: ${MAIL_FROM:-}
    networks: [jeebhar]

  client:
    image: ${CLIENT_IMAGE:-jeebhar-client:local}
    build:
      context: .
      dockerfile: docker/client.Dockerfile
      args:
        # Same origin: nginx in this container proxies /api to `server`.
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    ports:
      - '${HTTP_PORT:-8080}:80'
    networks: [jeebhar]

volumes:
  mongo-data:

networks:
  jeebhar:
    driver: bridge
