name: CD

# Publishes container images to GitHub Container Registry and deploys.
#
# Triggered by a push to main or a version tag. The deploy job is guarded by a
# GitHub Environment, so you can require a manual approval before production.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Publish server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/server:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/server:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/client.Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/client:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/client:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish
    # Configure required reviewers on this Environment in repo settings to gate
    # production behind an approval.
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - uses: actions/checkout@v4

      # The `secrets` context cannot be used directly in a step-level `if`, so
      # presence is turned into an output first. This keeps the pipeline green
      # before a host is configured, and deploying the moment one is.
      - name: Check whether a deploy target is configured
        id: target
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "${DEPLOY_HOST}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.target.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REGISTRY_USER,REGISTRY_TOKEN,SERVER_IMAGE,CLIENT_IMAGE
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Point compose at the images this run published. docker-compose.yml
            # reads SERVER_IMAGE / CLIENT_IMAGE and falls back to locally built
            # tags, so without this the deploy would try to pull "…:local".
            touch .env
            grep -vE '^(SERVER_IMAGE|CLIENT_IMAGE)=' .env > .env.next || true
            printf 'SERVER_IMAGE=%s\nCLIENT_IMAGE=%s\n' "$SERVER_IMAGE" "$CLIENT_IMAGE" >> .env.next
            mv .env.next .env

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            docker compose pull mongo server client
            # --no-build: run exactly the images that were pulled, never a local build.
            docker compose up -d --remove-orphans --no-build
            docker image prune -f
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/server:${{ needs.publish.outputs.version }}
          CLIENT_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/client:${{ needs.publish.outputs.version }}

      - name: Report a skipped deploy
        if: steps.target.outputs.configured != 'true'
        run: |
          echo "::notice title=Deploy skipped::Images published to ghcr.io."
          echo "Add DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_PATH secrets to enable the deploy step."

  smoke:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ vars.DEPLOY_URL != '' }}

    steps:
      - name: Health check
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl -fsS "${{ vars.DEPLOY_URL }}/api/health" | tee /dev/stderr | grep -q '"ok":true'; then
              echo "Health check passed on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt} failed; retrying in 10s."
            sleep 10
          done
          echo "::error title=Smoke test failed::/api/health never returned ok after 10 attempts."
          exit 1
